<title>Vari Fleet &amp; Meeting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: ປະຕູເຂົ້າລະບົບພາບຖະໜົນ -> ແອັບແທັບ (ຈອງ / ລາຍການ / ຕາຕະລາງ / ລົດ) */
:root{
 --bg:#eaf0f1;--card:#ffffff;--ink:#132a31;--mut:#566d75;--line:#d3dee1;
 --pri:#0e6b7b;--pri-ink:#ffffff;--road:#22333a;--amber:#f2a516;
 --ok:#1b8a4b;--okbg:#dff3e7;--bad:#c2362b;--badbg:#fbe3e0;--warn:#9a6409;--warnbg:#fdf0d2;--done:#e3e9eb;
 --nav:#17335f;
 --font:"Noto Sans Lao","Phetsarath OT","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0c161a;--card:#14242a;--ink:#e6f0f2;--mut:#93aab1;--line:#26404a;
 --pri:#4cc2d6;--pri-ink:#06242b;--road:#060d10;--amber:#ffbf3c;
 --ok:#5ad388;--okbg:#12361f;--bad:#ff8a7e;--badbg:#3d1915;--warn:#ffcb5c;--warnbg:#3a2a07;--done:#22353c;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0c161a;--card:#14242a;--ink:#e6f0f2;--mut:#93aab1;--line:#26404a;
 --pri:#4cc2d6;--pri-ink:#06242b;--road:#060d10;--amber:#ffbf3c;
 --ok:#5ad388;--okbg:#12361f;--bad:#ff8a7e;--badbg:#3d1915;--warn:#ffcb5c;--warnbg:#3a2a07;--done:#22353c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;background:var(--bg);color:var(--ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding-block:16px 48px}
[hidden]{display:none!important}

/* ===== ໜ້າເຂົ້າສູ່ລະບົບ ===== */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px}
.gate-box{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.scene svg{display:block}
.scene svg *{transform-box:fill-box}
.cbob{animation:bob .4s ease-in-out infinite alternate}
.hl{animation:blink 1.4s steps(2) infinite}
.pin{animation:drop 3.6s cubic-bezier(.3,.1,.3,1) infinite}
.rip{transform-origin:center;animation:rip 3.6s ease-out infinite}
.cal{transform-origin:center;animation:pop 3.6s ease-out infinite}
.tick{stroke-dasharray:46;animation:draw 3.6s ease-out infinite}
.pp{transform-origin:50% 100%;animation:sit 5.2s ease-out infinite}
.p2{animation-delay:.35s}.p3{animation-delay:.7s}.p4{animation-delay:1.05s}
.b1,.b2,.b3,.b4{transform-origin:50% 100%;animation:bar 3s ease-in-out infinite alternate}
.b2{animation-delay:.2s}.b3{animation-delay:.4s}.b4{animation-delay:.6s}
.hand{transform-origin:0% 100%;animation:spin 6s linear infinite}
@keyframes blink{50%{opacity:.25}}
@keyframes drop{0%{transform:translateY(-46px);opacity:0}25%{opacity:1}45%{transform:translateY(0)}55%{transform:translateY(-7px)}65%,85%{transform:translateY(0);opacity:1}100%{transform:translateY(0);opacity:0}}
@keyframes rip{0%,44%{transform:scale(.2);opacity:0}50%{opacity:.9}85%,100%{transform:scale(2.4);opacity:0}}
@keyframes draw{0%,20%{stroke-dashoffset:46}55%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
@keyframes sit{0%,5%{transform:scale(0)}20%{transform:scale(1.15)}30%,90%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes bar{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.scene{position:relative;height:170px;background:linear-gradient(#bfe3ee,#e9f6f9 70%);overflow:hidden}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scene{background:linear-gradient(#0f2a35,#17404c 75%)}}
:root[data-theme="dark"] .scene{background:linear-gradient(#0f2a35,#17404c 75%)}
.hills{position:absolute;bottom:34px;left:0;width:200%;height:50px;background:radial-gradient(60px 40px at 40px 50px,#7bb7a6 98%,transparent) 0 0/160px 50px repeat-x;opacity:.55;animation:slide 14s linear infinite}
.road{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--road)}
.road::before{content:"";position:absolute;left:0;top:15px;width:200%;height:4px;background:repeating-linear-gradient(90deg,var(--amber) 0 26px,transparent 26px 56px);animation:slide .9s linear infinite}
.car{position:absolute;bottom:26px;left:-120px;width:110px;animation:drive 5s cubic-bezier(.45,0,.2,1) infinite}
.car .body{animation:bob .35s ease-in-out infinite alternate}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
.beam{opacity:.0;animation:beam 5s ease-in-out infinite}
.gate-in{padding:22px 24px 26px;text-align:center}
.gate-in h1{margin:0 0 4px;font-size:24px;font-weight:800}
.gate-in p{margin:0 0 16px;color:var(--mut)}
.who{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px;animation:rise .5s .1s both}
.who img{width:44px;height:44px;border-radius:50%}
.who b{display:block}.who small{color:var(--mut);word-break:break-all}
.fmt{font-weight:400;font-size:11px;opacity:.65;white-space:nowrap}
.role{display:inline-block;font-size:12px;font-weight:700;padding:1px 10px;border-radius:99px;margin-top:2px}
.role.admin{background:var(--amber);color:#2a1c00}.role.user{background:var(--done);color:var(--mut)}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
.note{font-size:13px;color:var(--mut);margin-top:12px}
.lf{text-align:left}
.link{background:none;border:0;color:var(--pri);cursor:pointer;text-decoration:underline;padding:0;font-size:13px}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.kind{display:inline-block;font-size:11px;font-weight:700;padding:0 8px;border-radius:6px;margin-right:6px;background:var(--done);color:var(--mut)}

/* ===== ສ່ວນຫົວ ແລະ ແທັບ ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;margin-bottom:10px;border-radius:14px;background:var(--nav);color:#fff;animation:rise .5s both}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand .co{border-left:1px solid rgba(255,255,255,.28);padding-left:14px;line-height:1.35}
.brand .co b{display:block;font-size:17px;font-weight:800}
.brand .co span{font-size:13px;color:#b9c8e0}
.sysname{margin:0 0 10px;font-size:14px;color:var(--mut)}
.sysname b{color:var(--ink);font-size:16px}
.me small{color:#b9c8e0}
.me .sm{color:#fff;border-color:rgba(255,255,255,.35)}.me .sm:hover{background:rgba(255,255,255,.14)}
.logo{flex:none;animation:pop .6s both}
.logo img{display:block;height:48px;width:auto}
.glogo{display:block;height:60px;width:auto;margin:0 auto 10px;animation:pop .8s .2s both}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.me img{width:32px;height:32px;border-radius:50%}
.wa{display:block;text-align:center;text-decoration:none;margin-top:10px;background:#25d366;color:#062b12;font-weight:700;padding:12px 18px;border-radius:12px}
.wa:hover{filter:brightness(1.05)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;position:relative;margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--mut);transition:background .2s,color .2s,transform .15s}
.tabs button:hover{background:var(--done);transform:translateY(-1px)}
.tabs button.on{background:var(--pri);color:var(--pri-ink);font-weight:700}
.badge{background:var(--amber);color:#2a1c00;border-radius:99px;font-size:12px;font-weight:800;padding:0 7px;margin-left:6px;animation:pulse 1.6s infinite}

/* ===== ຄອມໂພເນັນ ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;animation:rise .45s both}
.panel h2{margin:0 0 6px;font-size:18px}
.sub{color:var(--mut);margin:0 0 6px;font-size:14px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;min-width:0;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);transition:border-color .2s,box-shadow .2s}
.grid2>*{min-width:0}
.panel,.item,.lf,.pww{min-width:0}
/* iOS: ບັງຄັບຊ່ອງວັນທີໃຫ້ຢູ່ໃນກອບ ແລະ ສູງເທົ່າຊ່ອງອື່ນ */
input[type=date],input[type=datetime-local]{-webkit-appearance:none;appearance:none;display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;text-align:left;line-height:1.3}
input[type=date]::-webkit-date-and-time-value,
input[type=datetime-local]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.3em}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=datetime-local]::-webkit-calendar-picker-indicator{margin-inline-start:auto;opacity:.6}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:10px 20px;background:var(--pri);color:var(--pri-ink);font-weight:700;cursor:pointer;margin-top:16px;transition:transform .15s,box-shadow .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(14,107,123,.3)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.sm{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 12px;font-size:13px;cursor:pointer;margin:2px 4px 2px 0;transition:background .15s,transform .15s}
.sm:hover{background:var(--done);transform:translateY(-1px)}
.sm.go{border-color:var(--ok);color:var(--ok)}.sm.no{border-color:var(--bad);color:var(--bad)}.sm.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:transparent;padding:4px 14px;border-radius:99px;cursor:pointer;font-size:13px;transition:all .2s}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;padding:1px 12px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.pending{background:var(--warnbg);color:var(--warn);animation:pulse 2s infinite}
.pill.approved{background:var(--okbg);color:var(--ok)}
.pill.rejected,.pill.cancelled{background:var(--badbg);color:var(--bad)}
.item{display:grid;grid-template-columns:1fr auto;gap:8px 14px;padding:14px 0;border-bottom:1px solid var(--line);animation:rise .4s both}
.item:last-child{border-bottom:0}
.item .t{font-weight:700}.item .m{color:var(--mut);font-size:13px}
@media(max-width:560px){.item{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--mut);padding:26px 8px}
.empty svg{display:block;margin:0 auto 6px;animation:bob 1s ease-in-out infinite alternate}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:14px;animation:rise .3s both}
.msg.err{background:var(--badbg);color:var(--bad)}.msg.ok{background:var(--okbg);color:var(--ok)}
.num{font-variant-numeric:tabular-nums}

/* ===== ຕາຕະລາງລົດ ===== */
.row{margin:14px 0}
.row .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px;font-weight:700}
.bar{position:relative;height:30px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--done) 0 calc(100%/24 - 1px),var(--bg) calc(100%/24 - 1px) calc(100%/24))}
.blk{position:absolute;top:3px;bottom:3px;border-radius:6px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;overflow:hidden;font-size:11px;padding:0 6px;line-height:24px;white-space:nowrap;color:#fff}
.blk.approved{background:var(--ok)}.blk.pending{background:var(--amber);color:#2a1c00}
.hours{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:2px}
.free{color:var(--ok);font-size:13px}
.datepick{max-width:200px}

/* ===== Toast + confetti ===== */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;opacity:0;transition:all .35s;z-index:20;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
.conf{position:fixed;top:40%;left:50%;width:9px;height:14px;border-radius:2px;z-index:30;pointer-events:none;animation:conf 1.4s cubic-bezier(.2,.7,.3,1) forwards}

@keyframes slide{to{transform:translateX(-160px)}}
@keyframes drive{0%{left:-120px}55%{left:calc(50% - 55px)}70%{left:calc(50% - 55px)}100%{left:calc(100% + 20px)}}
@keyframes bob{to{transform:translateY(-2px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beam{0%,45%{opacity:0}60%,70%{opacity:.9}100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--amber) 30%,transparent)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
@keyframes conf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

(function(){
 var SB_URL="https://wstgajpuyupvuoqzuzpw.supabase.co";
 var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzdGdhanB1eXVwdnVvcXp1enB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyNjA0NDYsImV4cCI6MjEwODgzNjQ0Nn0.14Z2w3_IXOLS1N41rqUC1b316FQ5GRNjr0VJqcxw0O0";

 var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

 /* ຊື່ທີ່ແອັບໃຊ້ <-> ຊື່ຄໍລຳໃນຖານຂໍ້ມູນ */
 var MAP={
  vehicles    :{table:"vehicles"},
  rooms       :{table:"rooms"},
  profiles    :{table:"profiles"},
  bookings    :{table:"bookings",     to:{vehicleId:"vehicle_id",start:"start_ts",end:"end_ts",created:"created_at"}},
  roomBookings:{table:"room_bookings",to:{roomId:"room_id",      start:"start_ts",end:"end_ts",created:"created_at"}},
  decisions   :{table:"decisions",    to:{by:"decided_by",at:"decided_at"},pk:"booking_id"}
 };
 function cfg(c){var x=MAP[c]||{table:c};return{table:x.table,to:x.to||{},pk:x.pk||"id"}}
 function toDb(c,o){var m=cfg(c).to,r={};for(var k in o)r[m[k]||k]=o[k];return r}
 function toApp(c,row){var m=cfg(c).to,inv={},r={};for(var k in m)inv[m[k]]=k;
  for(var k in row)r[inv[k]||k]=row[k];return r}

 var listeners={},chans={};
 function snapshot(c){
  var x=cfg(c);
  return sb.from(x.table).select("*").then(function(res){
   if(res.error)throw res.error;
   return {docs:(res.data||[]).map(function(row){
    var d=toApp(c,row);return{id:row[x.pk],data:function(){return d}}})};
  });
 }
 function refresh(c){
  if(!listeners[c]||!listeners[c].length)return;
  snapshot(c).then(function(s){listeners[c].forEach(function(f){try{f(s)}catch(e){}})})
             .catch(function(){});
 }
 function watch(c,cb,onErr){
  (listeners[c]=listeners[c]||[]).push(cb);
  snapshot(c).then(cb).catch(function(e){onErr&&onErr(e)});
  if(!chans[c]){
   chans[c]=sb.channel("rt_"+c)
    .on("postgres_changes",{event:"*",schema:"public",table:cfg(c).table},function(){refresh(c)})
    .subscribe();
  }
  return function(){};
 }
 function done(c){return function(r){if(r&&r.error)throw r.error;refresh(c);return r}}

 function docRef(c,id){
  var x=cfg(c);
  return{
   get:function(){return sb.from(x.table).select("*").eq(x.pk,id).maybeSingle().then(function(r){
     var d=r.data?toApp(c,r.data):null;return{exists:!!d,data:function(){return d}}})},
   set:function(o){var row=toDb(c,o);row[x.pk]=id;
     return sb.from(x.table).upsert(row).then(done(c))},
   update:function(o){return sb.from(x.table).update(toDb(c,o)).eq(x.pk,id).then(done(c))},
   delete:function(){return sb.from(x.table).delete().eq(x.pk,id).then(done(c))}
  };
 }
 function colRef(c){
  var x=cfg(c);
  return{
   doc:function(id){return docRef(c,id)},
   add:function(o){return sb.from(x.table).insert(toDb(c,o)).select().then(function(r){
     if(r.error)throw r.error;refresh(c);
     return{id:r.data&&r.data[0]&&r.data[0][x.pk]}})},
   onSnapshot:function(cb,onErr){return watch(c,cb,onErr)}
  };
 }
 var db={collection:colRef,
   doc:function(p){var i=p.lastIndexOf("/");return docRef(p.slice(0,i),p.slice(i+1))}};

 var ME={id:null,name:"",email:null,avatarUrl:PIX,isOwner:false,canEdit:false};
 var user={
  me:function(){return Promise.resolve(ME)},
  profiles:function(){
   return sb.from("profiles").select("id,name,email").then(function(r){
    var o={};(r.data||[]).forEach(function(p){o[p.id]={name:p.name||p.email,avatarUrl:PIX}});
    return o});
  }};

 window.__sb={client:sb,setMe:function(o){for(var k in o)ME[k]=o[k];return ME}};
 window.claude={use:function(w){return Promise.resolve(w==="user"?user:w==="db"?db:null)}};
})();

/* ===== ລະຫັດຜ່ານ (PBKDF2, ເກັບສ່ວນຕົວຂອງແຕ່ລະຄົນ) ===== */
const enc=new TextEncoder();
const b64=u=>btoa(String.fromCharCode(...u));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPw(pw,salt,iter){
 const k=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
 return b64(new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},k,256)));
}

}

 db.collection("vehicles").onSnapshot(s=>{vehicles=s.docs.map(d=>({id:d.id,...d.data()}));changed()},onErr);

async function submitRoom(){
 const g=i=>$("#"+i).value.trim(),m=$("#rmsg");
 const bad=t=>{m.innerHTML=`<div class="msg err">${t}</div>`};
 const b={uid:me.id,booker:g("r_who"),roomId:g("r_room"),start:g("r_s"),end:g("r_e"),title:g("r_title"),dep:g("r_dep"),pax:g("r_pax"),note:g("r_note"),cancelled:false,created:new Date().toISOString()};
 if(!b.booker)return bad("ກະລຸນາໃສ່ຊື່ຜູ້ຈອງ");
 if(!b.roomId||!b.start||!b.end||!b.title)return bad("ກະລຸນາເລືອກຫ້ອງ, ໃສ່ເວລາ ແລະ ຫົວຂໍ້ການປະຊຸມໃຫ້ຄົບ");
 if(b.end<=b.start)return bad("ເວລາສິ້ນສຸດຕ້ອງຢູ່ຫຼັງເວລາເລີ່ມ");
 const r=rOf(b.roomId);if(r&&r.capacity&&b.pax&&+b.pax>+r.capacity)return bad(`ຫ້ອງນີ້ຮອງຮັບໄດ້ ${esc(r.capacity)} ຄົນ`);
 const c=rclash(b.roomId,b.start,b.end);
 if(c)return bad(`ຫ້ອງນີ້ຖືກຈອງແລ້ວ ໂດຍ ${esc(bookerOf(c))} (${fmt(c.start)} – ${fmt(c.end)})`);
 $("#rsend").disabled=true;
 try{await db.collection("roomBookings").add(b);const rm=rOf(b.roomId)||{};
  const wt=`ແຈ້ງຈອງຫ້ອງປະຊຸມ\nຫ້ອງ: ${rm.name||""}\nຫົວຂໍ້: ${b.title}\nຜູ້ຈອງ: ${b.booker}${b.dep?" ("+b.dep+")":""}\nເວລາ: ${fmt(b.start)} - ${fmt(b.end)}${b.pax?"\nຜູ້ເຂົ້າຮ່ວມ: "+b.pax+" ຄົນ":""}${b.note?"\nອຸປະກອນ/ໝາຍເຫດ: "+b.note:""}`;
  m.innerHTML=`<div class="msg ok">ຈອງຫ້ອງສຳເລັດແລ້ວ</div>`+waBox(rm.notify_phone,wt,"ຜູ້ດູແລຫ້ອງປະຊຸມ");confetti();toast("ຈອງຫ້ອງປະຊຸມສຳເລັດ");
  ["r_s","r_e","r_title","r_dep","r_pax","r_note"].forEach(i=>$("#"+i).value="");$("#r_who").value=me.name||""}
 catch(e){bad("ບັນທຶກບໍ່ສຳເລັດ ("+esc(e&&e.code||"error")+"). ອາດຍັງບໍ່ມີສິດຂຽນຂໍ້ມູນ ໃຫ້ຖາມຜູ້ດູແລ.")}
 $("#rsend").disabled=false;
}

async function decide(id,status){
 if(status==="approved"){const b=bookings.find(x=>x.id===id);const c=b&&clash(b.vehicleId,b.start,b.end,id);if(c&&statusOf(c)==="approved")return toast("ຊ້ອນກັບການຈອງທີ່ອະນຸມັດແລ້ວ")}
 try{await db.doc("decisions/"+id).set({status,by:me.id,at:new Date().toISOString()});toast(status==="approved"?"ອະນຸມັດແລ້ວ":"ບໍ່ອະນຸມັດ");if(status==="approved")confetti()}
 catch(e){toast("ບໍ່ມີສິດອະນຸມັດ")}
}
async function cancelB(kind,id){
 const key=kind+id;
 if(armed!==key){armed=key;render();return}
 armed=null;try{await db.doc((kind==="car"?"bookings/":"roomBookings/")+id).update({cancelled:true});toast("ຍົກເລີກການຈອງແລ້ວ")}catch(e){toast("ຍົກເລີກບໍ່ສຳເລັດ")}
}
function items(){
 const a=bookings.map(b=>{const v=vOf(b.vehicleId);return{kind:"car",id:b.id,uid:b.uid,booker:b.booker,start:b.start,end:b.end,s:statusOf(b),
  title:(v?v.plate:"(ລົດຖືກລຶບ)")+" · "+b.dest,meta:[b.dep,b.tel,b.pax?b.pax+" ຄົນ":""].filter(Boolean).join(" · "),note:b.purpose}});
 const r=rbookings.map(b=>{const x=rOf(b.roomId);return{kind:"room",id:b.id,uid:b.uid,booker:b.booker,start:b.start,end:b.end,s:b.cancelled?"cancelled":"approved",
  title:(x?x.name:"(ຫ້ອງຖືກລຶບ)")+" · "+b.title,meta:[b.dep,b.pax?b.pax+" ຄົນ":""].filter(Boolean).join(" · "),note:b.note}});
 return[...a,...r].sort((p,q)=>q.start.localeCompare(p.start));

 if(filter==="mine")rows=rows.filter(r=>r.uid===me.id);
 if(filter==="pending")rows=rows.filter(r=>r.s==="pending");
 const chips=[["all","ທັງໝົດ"],["car","ລົດ"],["room","ຫ້ອງປະຊຸມ"],["mine","ຂອງຂ້ອຍ"],["pending","ລໍຖ້າອະນຸມັດ"]].map(([k,n])=>`<button class="chip ${filter===k?"on":""}" data-f="${k}">${n}</button>`).join("");

  if((mine||isAdmin)&&["pending","approved"].includes(b.s))act+=`<button class="sm ${armed===key?"arm":""}" data-a="cx" data-k="${b.kind}" data-id="${b.id}">${armed===key?"ກົດອີກຄັ້ງເພື່ອຢືນຢັນ":"ຍົກເລີກ"}</button>`;
  const lbl=b.kind==="room"&&b.s==="approved"?"ຈອງສຳເລັດ":ST[b.s];
  return `<div class="item" style="animation-delay:${Math.min(i,10)*50}ms"><div><div class="t"><span class="kind">${b.kind==="car"?"ລົດ":"ຫ້ອງ"}</span>${esc(b.title)}</div>

   <div><span class="pill ${b.s}">${lbl}</span><div style="margin-top:6px">${act}</div></div></div>`}).join(""):emptyIco(filter==="room"?"room":filter==="car"?"car":"cal","ຍັງບໍ່ມີລາຍການຈອງ")}</div>`;
 $("#view").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{filter=c.dataset.f;render()});

/* ===== ຕາຕະລາງລາຍວັນ (ລົດ / ຫ້ອງ) ===== */
function vCal(){
 const s=calDay+"T00:00",e=calDay+"T23:59",car=calKind==="car";
 const res=(car?vehicles:rooms).filter(v=>v.active!==false);
 const toMin=t=>{const[h,m]=t.split(":");return +h*60+ +m};
 const chips=[["car","ລົດ"],["room","ຫ້ອງປະຊຸມ"]].map(([k,n])=>`<button class="chip ${calKind===k?"on":""}" data-k="${k}">${n}</button>`).join("");
 $("#view").innerHTML=`<div class="panel"><h2>ຕາຕະລາງລາຍວັນ</h2><div class="chips">${chips}</div><label for="d">ເລືອກວັນທີ</label><input id="d" class="datepick" type="date" value="${calDay}">
 ${res.length?res.map(v=>{
  const bs=(car?bookings.filter(b=>b.vehicleId===v.id&&["pending","approved"].includes(statusOf(b))):rbookings.filter(b=>b.roomId===v.id&&!b.cancelled)).filter(b=>b.start<=e&&b.end>=s).sort((a,b)=>a.start.localeCompare(b.start));
  const blocks=bs.map((b,i)=>{const st=b.start.slice(0,10)<calDay?0:toMin(b.start.slice(11,16));const en=b.end.slice(0,10)>calDay?1440:toMin(b.end.slice(11,16));
   const sx=car?statusOf(b):"approved";const lab=car?bookerOf(b):b.title;
   return `<div class="blk ${sx}" style="left:${st/14.4}%;width:${Math.max((en-st)/14.4,2)}%;animation-delay:${i*120}ms" title="${esc(lab)} · ${esc(bookerOf(b))} ${fmt(b.start)}–${fmt(b.end)}">${esc(lab)}</div>`}).join("");
  return `<div class="row"><div class="h"><span>${esc(car?v.plate:v.name)} <small style="font-weight:400;color:var(--mut)">${esc(car?(v.name||""):(v.capacity?v.capacity+" ຄົນ":""))}</small></span>${bs.length?"":'<span class="free">ຫວ່າງທັງມື້</span>'}</div><div class="bar">${blocks}</div><div class="hours num"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div>`}).join(""):emptyIco(car?"car":"room",car?"ຍັງບໍ່ມີລົດໃນລະບົບ":"ຍັງບໍ່ມີຫ້ອງປະຊຸມໃນລະບົບ")}</div>`;
 $("#d").onchange=ev=>{calDay=ev.target.value||today();vCal()};
 $("#view").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{calKind=c.dataset.k;vCal()});
}
